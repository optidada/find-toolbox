name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # net472 (CMS 11) needs the .NET Framework reference assemblies: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build library
        run: dotnet build src/Optidada.SearchNavigation.Toolbox -c Release

      # Unit tests only: the integration tests need the Alloy sites and a Find index (they skip without them)
      - name: Unit tests
        run: dotnet test tests/Optidada.SearchNavigation.Toolbox.UnitTests -c Release --logger "trx" --results-directory TestResults

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Pack
        run: dotnet pack src/Optidada.SearchNavigation.Toolbox -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*

  release:
    # Push a tag like v3.0.0-beta.3 (matching <Version> in the csproj) to create a GitHub release with the packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if [[ "$tag" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes $prerelease
